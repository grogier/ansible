# Playbook to update and upgrade apt packages on all hosts
- hosts: all
  become: yes
  #become_user: rogier

  vars:
    ansible_python_interpreter: auto_silent
    discord_webhook_url: "{{ lookup('env', 'DISCORD_WEBHOOK_URL') }}"

  tasks:
  - name: Update and upgrade apt packages
    apt:
      upgrade: yes
      update_cache: yes
      cache_valid_time: 86400  # cache_valid_time is in seconds
    async: 900  # Maximum time allowed in seconds (15 minutes)
    poll: 10    # Checks status every 10 seconds
    notify: Notify Discord on Success
    ignore_errors: yes
    register: apt_result

  - name: Send Discord alert on failure
    uri:
      url: "{{ discord_webhook_url }}"
      method: POST
      body_format: json
      body:
        content: "❌ **APT Update Failed** on host `{{ inventory_hostname }}`!"
      status_code: 204
    when: apt_result.failed

  handlers:
    - name: Notify Discord on Success
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "✅ **APT Update Succeeded** on host `{{ inventory_hostname }}`."
        status_code: 204
      when: discord_webhook_url != ""