# Playbook to update and upgrade apt packages on all hosts
- hosts: all
  become: yes
  #become_user: rogier
  tasks:
  - name: Update and upgrade apt packages
    apt:
      upgrade: yes
      update_cache: yes
      cache_valid_time: 86400  # cache_valid_time is in seconds
    async: 900  # Maximum time allowed in seconds (15 minutes)
    poll: 10    # Checks status every 10 seconds


